name: Build Rukshan A/L Study App APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o Rukshan_AL_Study_App_With_Auto_Build.zip
          ls -la
          ls -la RukshanALStudyApp

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: RukshanALStudyApp
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: |
          cp RukshanALStudyApp/app/build/outputs/apk/debug/app-debug.apk Rukshan_AL_Study_App.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rukshan_AL_Study_App
          path: Rukshan_AL_Study_App.apk
